name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  db:
    name: Migrations, seed, RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0 # match the supabase devDependency; config.toml uses keys the action's default CLI rejects
      - run: supabase start
      - run: supabase db reset # applies migrations + seed.sql fresh
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: ./tests/rls/run.sh
